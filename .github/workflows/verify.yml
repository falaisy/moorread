name: verify

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "store-listing/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "store-listing/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify
